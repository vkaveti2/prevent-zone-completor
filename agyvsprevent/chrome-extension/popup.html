<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Prevent Zone Automator Pro</title>
  <style>
    body {
      width: 280px;
      margin: 0;
      padding: 14px;
      background: #0f172a;
      color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 13px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      padding-bottom: 10px;
      margin-bottom: 12px;
    }
    .title {
      font-weight: 700;
      font-size: 14px;
      color: #38bdf8;
    }
    .status {
      font-size: 11px;
      background: #1e293b;
      padding: 4px 8px;
      border-radius: 6px;
      color: #94a3b8;
    }
    .section-label {
      font-size: 11px;
      text-transform: uppercase;
      color: #64748b;
      font-weight: 600;
      margin-bottom: 6px;
    }
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    button {
      background: #1e293b;
      border: 1px solid rgba(255,255,255,0.1);
      color: white;
      padding: 9px 12px;
      border-radius: 8px;
      font-weight: 500;
      cursor: pointer;
      text-align: left;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: background 0.15s ease;
    }
    button:hover {
      background: #334155;
    }
    button.primary {
      background: #2563eb;
      border-color: #3b82f6;
    }
    button.primary:hover {
      background: #1d4ed8;
    }
    .footer {
      margin-top: 12px;
      font-size: 11px;
      color: #64748b;
      text-align: center;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">⚡ Prevent Zone Automator</div>
    <div class="status" id="ext-status">Active</div>
  </div>

  <div class="section-label">Quick Actions</div>
  <div class="btn-group">
    <button class="primary" id="btn-16x">⚡ Set Speed to 16x</button>
    <button id="btn-autonext">▶ Toggle Auto-Click Next</button>
    <button id="btn-solve">🎯 Solve Quiz Answers</button>
    <button id="btn-submit">📤 Submit Quiz Attempt</button>
  </div>

  <div class="footer">
    Works on all Prevent Zone modules & SCORM Storyline players.
  </div>

  <script src="popup.js"></script>
</body>
</html>
